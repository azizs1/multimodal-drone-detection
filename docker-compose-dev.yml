services:
  # PostgreSQL Database
  postgres:
    build:
      context: ./sql
      dockerfile: Dockerfile
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=drone_detection
      - POSTGRES_USER=droneuser
      - POSTGRES_PASSWORD=dronepass
    networks:
      - drone-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droneuser -d drone_detection"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Media Server (RTSP Hub)
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "8554:8554" # RTSP
      - "8888:8888" # HLS
    volumes:
      - ./simulator/mediamtx.yml:/mediamtx.yml
      - hls-data:/hls
    networks:
      - drone-network
    command: /mediamtx.yml
    restart: always

  # RustFS Object Storage
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-server
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - ./storage:/data
    networks:
      - drone-network
    command: /data
    restart: always

  # Simulator inference publisher (annotates RGB + thermal and publishes to MediaMTX)
  stream-simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    container_name: stream-simulator
    environment:
      - PLAYBACK_FPS=20
      - LOOP_VIDEO=true
      - OPENCV_VIDEOIO_PRIORITY_FFMPEG=1000
    networks:
      - drone-network
    depends_on:
      - mediamtx
    restart: always

  # ML Inference (subscribes to ZeroMQ frames from simulator)
  ml-inference:
    build:
      context: .
      dockerfile: jetson/Dockerfile
    container_name: ml-inference
    volumes:
      - ./offline_ml/weights:/app/offline_ml/weights:ro
    environment:
      # ZeroMQ frame transport
      - ZMQ_FRAME_CONNECT_ENDPOINT=tcp://stream-simulator:5560
      - FUSION_ENDPOINT=http://fusion:8050/fusion/ingest
      - RUSTFS_ENDPOINT=http://rustfs:9000
      - RUSTFS_PUBLIC_BASE_URL=http://localhost:9000
      - RUSTFS_BUCKET=drone-detection
      - RUSTFS_SKIP_BOOTSTRAP=true
      - RUSTFS_STARTUP_PROBE=true
      - INFERENCE_SAVE_CONF_THRESHOLD=0.75
      - RGB_MODEL_PATH=/app/offline_ml/weights/visual_no_augmentation_best.pt
      - THERMAL_MODEL_PATH=/app/offline_ml/weights/thermal_no_augmentation_best.pt
      # RTSP publishing is always enabled in ml-inference
      - INFERENCE_VISUAL_RTSP_URL=rtsp://mediamtx:8554/visual
      - INFERENCE_THERMAL_RTSP_URL=rtsp://mediamtx:8554/thermal
      # Output frame sizing
      - INFERENCE_VISUAL_OUT_WIDTH=640
      - INFERENCE_VISUAL_OUT_HEIGHT=360
      - INFERENCE_THERMAL_OUT_WIDTH=160
      - INFERENCE_THERMAL_OUT_HEIGHT=120
      # Encoding parameters for RTSP output
      - INFERENCE_X264_CRF=30
      - INFERENCE_X264_MAXRATE=900
      - INFERENCE_X264_BUFSIZE=900
      - INFERENCE_X264_KEYINT=12
    networks:
      - drone-network
    depends_on:
      - mediamtx
      - stream-simulator
      - fusion
      - rustfs
    restart: always

  # Fusion service (aggregates RGB/thermal predictions and posts to backend)
  fusion:
    build:
      context: .
      dockerfile: jetson/Dockerfile
    container_name: fusion
    environment:
      - FUSION_HOST=0.0.0.0
      - FUSION_PORT=8050
      - BACKEND_INCIDENT_ENDPOINT=http://backend:8000/incidents
    ports:
      - "8050:8050"
    networks:
      - drone-network
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    entrypoint: ["uv", "run", "python", "-m", "ml.fusion_service"]
    restart: always

  # Backend
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - hls-data:/hls:ro
    environment:
      - DATABASE_URL=postgresql://droneuser:dronepass@postgres:5432/drone_detection
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432

      - POSTGRES_DB=drone_detection
      - POSTGRES_USER=droneuser
      - POSTGRES_PASSWORD=dronepass
    networks:
      - drone-network
    depends_on:
      postgres:
        condition: service_healthy
      mediamtx:
        condition: service_started
      stream-simulator:
        condition: service_started
    restart: always
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000
    container_name: frontend
    ports:
      - "3000:3000"
    networks:
      - drone-network
    depends_on:
      - backend
    restart: always

networks:
  drone-network:
    driver: bridge

volumes:
  hls-data:
  postgres-data:
