services:
  # PostgreSQL Database
  postgres:
    build:
      context: ./sql
      dockerfile: Dockerfile
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=drone_detection
      - POSTGRES_USER=droneuser
      - POSTGRES_PASSWORD=dronepass
    networks:
      - drone-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droneuser -d drone_detection"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Media Server (RTSP Hub)
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "8554:8554" # RTSP
      - "8888:8888" # HLS
    volumes:
      - ./simulator/mediamtx.yml:/mediamtx.yml
      - hls-data:/hls
    networks:
      - drone-network
    command: /mediamtx.yml
    restart: always

  # RustFS Object Storage
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-server
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - ./storage:/data
    networks:
      - drone-network
    command: /data
    restart: always

  # Simulator inference publisher (annotates RGB + thermal and publishes to MediaMTX)
  stream-simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    container_name: stream-simulator
    environment:
      - SIM_STREAM_MODE=rtsp
      - SIM_STREAM_HOST=mediamtx
      - SIM_VISUAL_RTSP_URL=rtsp://mediamtx:8554/visual
      - SIM_THERMAL_RTSP_URL=rtsp://mediamtx:8554/thermal
      - PLAYBACK_FPS=20
      - SIM_STREAM_FPS=12
      - SIM_VISUAL_OUT_WIDTH=640
      - SIM_VISUAL_OUT_HEIGHT=360
      - SIM_THERMAL_OUT_WIDTH=160
      - SIM_THERMAL_OUT_HEIGHT=120
      - SIM_X264_CRF=30
      - SIM_X264_MAXRATE=900
      - SIM_X264_BUFSIZE=900
      - SIM_X264_KEYINT=12
      - LOOP_VIDEO=true
      - OPENCV_VIDEOIO_PRIORITY_FFMPEG=1000
    networks:
      - drone-network
    depends_on:
      - mediamtx
    restart: always

  # Backend
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - hls-data:/hls:ro
    environment:
      - DATABASE_URL=postgresql://droneuser:dronepass@postgres:5432/drone_detection
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=drone_detection
      - POSTGRES_USER=droneuser
      - POSTGRES_PASSWORD=dronepass
    networks:
      - drone-network
    depends_on:
      postgres:
        condition: service_healthy
      mediamtx:
        condition: service_started
      stream-simulator:
        condition: service_started
    restart: always
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000
    container_name: frontend
    ports:
      - "3000:3000"
    networks:
      - drone-network
    depends_on:
      - backend
    restart: always

networks:
  drone-network:
    driver: bridge

volumes:
  hls-data:
  postgres-data:
