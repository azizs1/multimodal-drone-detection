services:
  jetson-core:
    build: ./jetson
    container_name: jetson-core
    network_mode: host
    runtime: nvidia
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - INFERENCE_SOURCE=${INFERENCE_SOURCE:-stream}
      - MAX_FRAMES=${MAX_FRAMES:-0}
      - RGB_MODEL_PATH=/app/offline_ml/weights/visual_no_augmentation_best.pt
      - THERMAL_MODEL_PATH=/app/offline_ml/weights/thermal_no_augmentation_best.pt
      - RGB_VIDEO_PATH=/app/simulator/videos/drone_visual.mp4
      - THERMAL_VIDEO_PATH=/app/simulator/videos/drone_thermal.mp4
      - FUSION_ENDPOINT=http://127.0.0.1:8050/fusion/ingest
      - BACKEND_INCIDENT_ENDPOINT=http://127.0.0.1:8000/incidents
      - FUSION_HOST=0.0.0.0
      - FUSION_PORT=8050
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./offline_ml/weights:/app/offline_ml/weights:ro
      - ./simulator/videos:/app/simulator/videos:ro
    command: python3 -u src/run_jetson_components.py
    restart: unless-stopped
