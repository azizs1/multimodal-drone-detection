[project]
name = "multimodal-drone-detection-backend"
version = "0.1.0"
description = "Backend of multimodal drone detection"
readme = "README.md"
requires-python = ">=3.10,<3.11"                      # Jetpack 6.1 uses 3.10

# Add more as needed
dependencies = [
    "fastapi>=0.129.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.11",
    "sqlalchemy>=2.0.46",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]
