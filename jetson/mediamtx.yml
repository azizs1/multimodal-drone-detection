# we wamt low-latency for HLS stuff
hls: yes
hlsVariant: lowLatency
hlsSegmentCount: 3 # only 3 segments in the buffer
hlsSegmentDuration: 1s # each segment only 1 second long
hlsPartDuration: 200ms # 200 ms parts per segment

# webrtc stream, lower latency
# http://localhost:9998/visual/
# http://localhost:9998/thermal/
webrtc: yes
webrtcAddress: :9998
webrtcICEServers:
  - stun:stun.l.google.com:19302
webrtcLocalUDPAddress: :8189

# this is to access api for debugging
# http://localhost:9997/v3/paths/list
api: yes
apiAddress: :9997

paths:
  visual:
    # inference publisher sends H264 MPEG-TS over UDP to port 6000
    source: udp://:6000
    sourceOnDemand: no
    # MediaMTX auto-detects the stream format.

  thermal:
    # inference publisher sends H264 MPEG-TS over UDP to port 6002
    source: udp://:6002
    sourceOnDemand: no
