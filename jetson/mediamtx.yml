# we wamt low-latency for HLS stuff
hls: yes
hlsVariant: lowLatency
hlsSegmentCount: 3 # only 3 segments in the buffer
hlsSegmentDuration: 1s # each segment only 1 second long
hlsPartDuration: 200ms # 200 ms parts per segment

# webrtc stream, lower latency
# http://localhost:9998/visual/
# http://localhost:9998/thermal/
webrtc: yes
webrtcAddress: :9998
webrtcICEServers:
  - stun:stun.l.google.com:19302
webrtcLocalUDPAddress: :8189

# rtsp stream, higher latency
# rtsp://localhost:8554/visual
# rtsp://localhost:8554/thermal
rtsp: yes
protocols: [tcp]
rtspAddress: :8554

# this is to access api for debugging
# http://localhost:9997/v3/paths/list
api: yes
apiAddress: :9997

paths:
  visual:
    # gstreamer sends H264 RTP over UDP to port 5000
    # pt 96
    source: udp://:5000
    sourceOnDemand: no
    # MediaMTX auto-detects RTP payload type (96)

  thermal:
    # gstreamer sends H264 RTP over UDP to port 5002
    # pt 97
    source: udp://:5002
    sourceOnDemand: no