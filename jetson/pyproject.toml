[project]
name = "multimodal-drone-detection-si-ml"
version = "0.1.0"
description = "Sensor ingestion and ML pipeline for multimodal drone detection"
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    "av>=12.0.0",
    "aioprocessing>=2.0.0",
    "boto3>=1.35.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "torch>=2.1.0,<2.11.0",
    "torchsummary>=1.5.1",
    "ultralytics>=8.0.0",
    "uvicorn[standard]>=0.30.0",
    "pyzmq>=26.0.0",
]

[project.optional-dependencies]
sensor = [
    "opencv-python>=4.11.0.86",
    "python-dotenv>=1.1.1",
    # On Jetson/aarch64, `gi` is provided by OS packages (python3-gi + GStreamer libs).
    # On non-Jetson Linux, install PyGObject to satisfy the `gi` import in ingest_gi.py.
    "PyGObject>=3.48.0; platform_system == 'Linux' and platform_machine != 'aarch64'",
]
