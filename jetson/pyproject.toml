[project]
name = "multimodal-drone-detection-si-ml"
version = "0.1.0"
description = "Sensor ingestion and ML pipeline for multimodal drone detection"
readme = "README.md"
requires-python = ">=3.10,<3.13" # Jetpack 6.1 uses 3.10

dependencies = [
    "aioprocessing>=2.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "uvicorn[standard]>=0.30.0",
    "pyzmq>=25.0.0",
    # Jetson-only ML runtime deps (avoid cross-platform uv resolution failures).
    "torchsummary>=1.5.1; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "ultralytics>=8.0.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torch==2.5.0a0+872d972e41.nv24.8; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version >= '3.10' and python_version < '3.11'",
]

[project.optional-dependencies]
sensor = [
    "python-dotenv>=1.1.1"
]

[tool.uv]
managed = true
package = false

[tool.uv.sources]
torch = { url = "https://developer.download.nvidia.com/compute/redist/jp/v61/pytorch/torch-2.5.0a0+872d972e41.nv24.08.17622132-cp310-cp310-linux_aarch64.whl" }
