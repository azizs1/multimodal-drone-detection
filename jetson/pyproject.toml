[project]
name = "multimodal-drone-detection-si-ml"
version = "0.1.0"
description = "Sensor ingestion and ML pipeline for multimodal drone detection"
readme = "README.md"
requires-python = ">=3.10,<3.13" # Orin / modern fusion stack

dependencies = [
    "aioprocessing>=2.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "torch>=2.1.0",
    "torchsummary>=1.5.1",
    "ultralytics>=8.0.0",
    "uvicorn[standard]>=0.30.0",
]
